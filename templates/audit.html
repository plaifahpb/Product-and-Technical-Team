{% extends 'base.html' %}{% block content %}<h2 class="fw-bold">Audit Log</h2><div class="card"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Task</th><th>Field</th><th>Old</th><th>New</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.actor}}</td><td>{{r.action}}</td><td>{{r.task_id}}</td><td>{{r.field_name}}</td><td>{{r.old_value}}</td><td>{{r.new_value}}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
