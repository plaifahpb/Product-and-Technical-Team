<style>
  :root{
    --brand:#0f172a;
    --accent:#2563eb;
    --muted:#64748b;
    --bg:#f4f7fb;
  }

  body{
    font-family:Inter,'Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:#0f172a;
  }

  .sidebar{
    min-height:100vh;
    background:linear-gradient(180deg,#0f172a,#1e293b);
    color:white;
    position:sticky;
    top:0;
  }

  .sidebar a{
    color:#cbd5e1;
    text-decoration:none;
    display:block;
    padding:.72rem 1rem;
    border-radius:12px;
    margin:.15rem .6rem;
  }

  .sidebar a:hover,
  .sidebar .active{
    background:rgba(255,255,255,.12);
    color:#fff;
  }

  .brand{
    font-weight:800;
    letter-spacing:.3px;
    padding:1.2rem 1rem;
  }

  .card{
    border:0;
    border-radius:22px;
    box-shadow:0 10px 28px rgba(15,23,42,.08);
  }

  .kpi{
    border-left:5px solid var(--accent);
  }

  .kpi .num{
    font-size:2rem;
    font-weight:800;
  }

  /* STATUS STYLE */

  .status-pill{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
    line-height:1.2;
  }

  .status-completed{
    background:#dcfce7;
    color:#166534;
  }

  .status-progress{
    background:#dbeafe;
    color:#1d4ed8;
  }

  .status-pending{
    background:#ffedd5;
    color:#c2410c;
  }

  .status-overdue{
    background:#fee2e2;
    color:#991b1b;
  }

  /* PRIORITY */

  .priority-high,
  .priority-critical{
    background:#fee2e2;
    color:#991b1b;
    padding:4px 10px;
    border-radius:999px;
    font-weight:700;
  }

  /* TABLE */

  .table thead th{
    background:#f8fafc;
    color:#475569;
    font-size:.78rem;
    text-transform:uppercase;
  }

  .form-control,
  .form-select{
    border-radius:12px;
  }

  .btn{
    border-radius:12px;
  }

  .case-info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.75rem 1rem;
  }

  .case-info-grid span{
    display:block;
    color:#64748b;
    font-size:.82rem;
    margin-bottom:.15rem;
  }

  .case-info-grid b{
    font-size:.95rem;
  }

  .kb-textarea{
    min-height:145px;
    line-height:1.55;
  }

  .nav-link .bi-journal-text{
    color:#93c5fd;
  }

  @media(max-width:768px){
    .sidebar{
      min-height:auto;
      position:relative;
    }
  }
</style>
