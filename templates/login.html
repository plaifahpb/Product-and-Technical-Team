{% extends 'base.html' %}{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#2563eb);">
  <div class="col-md-4">
    <div class="card p-4">
      <h3 class="fw-bold mb-1">Task Tracker Internal</h3>
      <p class="text-muted mb-4">Secure Internal Operation Platform</p>
      <form method="post" autocomplete="off">
        <label class="form-label">Username</label>
        <input class="form-control mb-3" name="username" autocomplete="username">
        <label class="form-label">Password</label>
        <input class="form-control mb-3" type="password" name="password" autocomplete="current-password">
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <div class="small text-muted mt-3">Authorized users only</div>
    </div>
  </div>
</div>
{% endblock %}
